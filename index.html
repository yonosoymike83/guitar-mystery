<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Guitar Mystery Cache</title>

<link
    rel="stylesheet"
    href="styles.css"
>

</head>


<body>

<div class="container">


    <!-- ==================================================
         LOGO
         ================================================== -->

    <img
        src="guitar-mystery-logo.png"
        alt="Guitar Mystery Cache"
        class="logo"
    >


    <!-- ==================================================
         TÍTULO
         ================================================== -->

    <h1>
        Guitar Mystery Cache
    </h1>


    <!-- ==================================================
         SELECTOR DE IDIOMA
         ================================================== -->

    <div id="language-selector">

        <button onclick="setLanguage('ca')">
            CAT
        </button>

        <button onclick="setLanguage('es')">
            ESP
        </button>

        <button onclick="setLanguage('en')">
            ENG
        </button>

    </div>


    <!-- ==================================================
         LISTA
         ================================================== -->

    <div id="list">
        Cargando...
    </div>


</div>


<script>


// ======================================================
// DARK CACHE
// ======================================================

const darkCache =
    new URLSearchParams(
        window.location.search
    ).get("darkcache") === "true";


// ======================================================
// MARCAR EL BODY COMO DARK CACHE
// ======================================================

if(darkCache){

    document.body.classList.add(
        "dark-cache"
    );

}


// ======================================================
// IDIOMA
// ======================================================

let language =
    localStorage.getItem("language");


if(!language){

    const browserLang =
        navigator.language.toLowerCase();


    if(browserLang.startsWith("ca")){

        language = "ca";

    }else if(browserLang.startsWith("en")){

        language = "en";

    }else{

        language = "es";

    }

}


// ======================================================
// CAMBIAR IDIOMA
// ======================================================

function setLanguage(lang){

    localStorage.setItem(
        "language",
        lang
    );

    location.reload();

}


// ======================================================
// CARGAR LISTA
// ======================================================

async function loadList(){

    try{

        const response =
            await fetch(
                "challenges/index.json"
            );


        const challenges =
            await response.json();


        const container =
            document.getElementById(
                "list"
            );


        container.innerHTML = "";


        challenges.forEach(
            challenge => {

                const link =
                    document.createElement(
                        "a"
                    );


                link.className =
                    "challenge";


                link.href =
                    darkCache
                        ? `play.html?id=${challenge.id}&darkcache=true`
                        : `play.html?id=${challenge.id}`;


                link.textContent =
                    challenge.title[
                        language
                    ];


                container.appendChild(
                    link
                );

            }
        );


    }catch(error){

        console.error(
            "Error cargando challenges:",
            error
        );


        document.getElementById(
            "list"
        ).textContent =
            "Error cargando las canciones.";

    }

}


loadList();


</script>

</body>

</html>
