<!DOCTYPE html>
<html lang="ca">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Guitar Mystery Cache</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>


<body>


<script>

/* ======================================================
   DARK CACHE
   ====================================================== */

const darkCache =
    new URLSearchParams(
        window.location.search
    ).get("darkcache") === "true";


/* ======================================================
   MARCAR EL BODY
   ====================================================== */

if (darkCache) {

    document.body.classList.add("dark-cache");

}

</script>


<div class="container">


    <!-- ==================================================
         TÍTULO
         ================================================== -->

    <h1 id="challengeTitle">
        Carregant...
    </h1>


    <!-- ==================================================
         CONTROLES
         ================================================== -->

    <div class="controls">

        <button
            onclick="window.location='index.html'"
        >
            ←
        </button>

        <button
            onclick="setLanguage('ca')"
        >
            CAT
        </button>

        <button
            onclick="setLanguage('es')"
        >
            ESP
        </button>

        <button
            onclick="setLanguage('en')"
        >
            ENG
        </button>

    </div>


    <!-- ==================================================
         CONTROLES DE SONIDO
         ================================================== -->

    <div id="soundControls">

        <button
            class="sound-btn"
            onclick="setSound('triangle')"
        >
            🎵 Soft
        </button>

        <button
            class="sound-btn"
            onclick="setSound('sawtooth')"
        >
            🎸 Guitar
        </button>

        <button
            class="sound-btn"
            onclick="setSound('square')"
        >
            ⚡ Retro
        </button>

    </div>


    <!-- ==================================================
         INSTRUCCIONES
         ================================================== -->

    <div
        id="instructions"
        class="instructions"
    >
        Carregant...
    </div>


    <!-- ==================================================
         PROGRESO
         ================================================== -->

    <div id="progress">

        <span id="progressLabel">
            Trobades
        </span>

        :

        <span id="found">
            0
        </span>

        /

        <span id="total">
            0
        </span>

    </div>


    <!-- ==================================================
         MÁSTIL
         ================================================== -->

    <div
        id="fretboard-wrap-container"
        style="text-align:center;"
    >

        <div id="fretboard-wrap">

            <!-- Números de traste -->

            <div id="fret-labels"></div>


            <!-- Mástil -->

            <div id="fretboard"></div>

        </div>

    </div>


    <!-- ==================================================
         RESULTADO / COORDENADAS
         ================================================== -->

    <div id="coordinates">

        <div class="result-title">

            ✅

            <span id="resultText">
                Repte resolt
            </span>

        </div>


        <div
            class="coords"
            id="coordsText"
        >
            --
        </div>


        <button
            id="copyButton"
            onclick="copyCoords()"
        >
            📋 Copiar coordenades
        </button>

    </div>


</div>


<!-- ======================================================
     JAVASCRIPT DEL JUEGO
     ====================================================== -->

<script src="app.js"></script>


</body>

</html>
